# Default production Vendor Chains. Names and order only; no secrets.
version: 1
markets:
  A_SHARE:
    instrument_master:
      vendors: [local_master, seed_fixture]
    market_quote:
      vendors: [tencent, eastmoney]
    market_ohlcv:
      vendors: [tencent, eastmoney]
    market_structure:
      vendors: [eastmoney]
    fundamentals:
      vendors: [eastmoney]
    financial_statements:
      vendors: [sina, eastmoney]
    announcements:
      vendors: [cninfo, szse, sse]
    corporate_actions:
      vendors: [eastmoney]
    research_reports:
      vendors: [eastmoney, ths, iwencai]
    capital:
      vendors: [eastmoney, sina, hkex, sse, szse]
    limit_up:
      vendors: [eastmoney, ths]
    options:
      vendors: [sina]
    interactive_qa:
      vendors: [cninfo]
    news:
      vendors: [cls, eastmoney]
    sentiment:
      vendors: [ths, eastmoney]
    industry_cycle:
      vendors: [nahs]
    company_operating_metrics:
      vendors: [cninfo]
  US:
    instrument_master:
      vendors: [local_master, seed_fixture]
    market_quote:
      vendors: [yfinance, alpha_vantage]
    market_ohlcv:
      vendors: [yfinance, alpha_vantage]
    # Phase 3A uses application-owned asset-aware overrides instead:
    # futures quote = yfinance -> sina_futures; daily/weekly/monthly futures
    # bars = yfinance -> eastmoney_futures. Alpha Vantage is never sent futures.
    market_breadth:
      vendors: [yfinance]
    community_heat:
      vendors: [moomoo]
    # Phase 1G research chains (names/order only; adapters land in later slices).
    fundamentals:
      vendors: [yfinance, alpha_vantage, sec_edgar]
    financial_statements:
      vendors: [sec_edgar, yfinance, alpha_vantage]
    filings:
      vendors: [sec_edgar]
    corporate_actions:
      vendors: [yfinance, sec_edgar]
    insider_activity:
      vendors: [sec_edgar, alpha_vantage]
    # Phase 1H optional context chains. Sentiment sources are explicitly
    # composed per source; this order is only the default single-chain policy.
    news:
      vendors: [yfinance, alpha_vantage]
    macro:
      vendors: [fred]
    sentiment:
      vendors: [moomoo_feed, reddit]
    prediction_market:
      vendors: [polymarket]
    account:
      vendors: [schwab, moomoo, manual_csv]
  # Korea Exchange quote/bars and local-first symbol discovery. Yahoo symbols
  # (.KS/.KQ/^KS11) stay provider aliases rather than canonical identities.
  KR:
    instrument_master:
      vendors: [local_master, seed_fixture]
    market_quote:
      vendors: [yfinance]
    market_ohlcv:
      vendors: [yfinance]
  # Phase 3A CME specific-contract quote/bars (Yahoo) + public definitions/EOD.
  CME:
    market_quote:
      vendors: [yfinance]
    market_ohlcv:
      vendors: [yfinance]
    futures_reference:
      vendors: [cme_public]
    futures_statistics:
      vendors: [cme_public]
  # Phase 3A OTC metals / rolling CFD observation chain (Dukascopy free API).
  OTC:
    market_quote:
      vendors: [dukascopy]
    market_ohlcv:
      vendors: [dukascopy]
  # Phase 3A DCE live-hog official EOD (contractInfo + dayQuotes; free only).
  DCE:
    futures_reference:
      vendors: [dce_official]
    futures_statistics:
      vendors: [dce_official]

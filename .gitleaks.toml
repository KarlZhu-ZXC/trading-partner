[extend]
useDefault = true

[allowlist]
description = "Machine-local secrets and generated runtime/build artifacts"
paths = [
  '''^\.env(?:\..*)?$''',
  '''^data/secrets/''',
  '''^console/dist/''',
  '''(?:^|/)__pycache__/''',
]
regexes = [
  # Stable synthetic Attention key used only by a unit-test assertion.
  '''^broker-unresolved-order_1$''',
  # Stable synthetic Phase 4 acceptance idempotency keys; never Provider credentials.
  '''^phase4-(?:order-submit|activation)$''',
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-partner"
version = "0.1.0"
description = "Long-horizon investment research and judgment companion for A-share and US markets"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Trading Partner" }]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "uuid6>=2024.7.10",
    "httpx>=0.28.1",
    "yfinance>=1.4.1,<2",
    "moomoo-api>=10.8,<11",
    "schwab-py>=1.5,<2",
    "exchange-calendars>=4.5,<5",
    "ta-lib>=0.6.8,<0.7",
    "matplotlib>=3.10,<4",
    "pypdf>=5.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
trading-partner-mcp = "interfaces.mcp.server:main"
trading-partner-watchlist-sync = "interfaces.cli.watchlist_sync:main"
trading-partner-post-market-sync = "interfaces.cli.post_market_sync:main"
trading-partner-account-transactions = "interfaces.cli.account_transactions:main"
trading-partner-monitor-run = "interfaces.cli.monitor_run:main"
trading-partner-industry-sync = "interfaces.cli.industry_sync:main"

# Editable installs: put src/ on sys.path so bootstrap.py and the four packages
# resolve to live workspace sources. Do not use force-include for bootstrap —
# Hatch copies force-include files into site-packages even for editable wheels,
# which would shadow src/bootstrap.py. Do not use dev-mode-exact — editables
# can only map packages, not a free-standing top-level module.
[tool.hatch.build]
dev-mode-dirs = ["src"]

# Standard wheel: only-include + sources ships bootstrap.py and the four
# packages at the distribution root (no trading_partner package layer).
[tool.hatch.build.targets.wheel]
only-include = [
    "src/bootstrap.py",
    "src/application",
    "src/domain",
    "src/infrastructure",
    "src/interfaces",
]
sources = ["src"]

# Single tracked sources under root config/.
# Copy into the wheel next to infrastructure.config (no second repo copy).
[tool.hatch.build.targets.wheel.force-include]
"config/vendor_chains.default.yaml" = "infrastructure/config/vendor_chains.default.yaml"
"config/a_share_trading_calendar.v1.json" = "infrastructure/config/a_share_trading_calendar.v1.json"
"config/moomoo_security_corrections.yaml" = "infrastructure/config/moomoo_security_corrections.yaml"
"config/cninfo_org_map.v1.json" = "infrastructure/config/cninfo_org_map.v1.json"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
packages = ["application", "domain", "infrastructure", "interfaces"]
# bootstrap is a free-standing top-level module under src/ (not a package).
modules = ["bootstrap"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "exchange_calendars.*",
    "uuid6.*",
    "moomoo.*",
    "schwab.*",
    "yfinance.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["bootstrap", "application", "domain", "infrastructure", "interfaces"]
branch = true
